# Fetch Hugging Face docs via per-package llms.txt, optional zh MT, build+deploy Pages.

name: Fetch · Build · Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Skip re-fetch (build committed docs only)"
        type: boolean
        default: false
      skip_translate:
        description: "Skip zh-CN machine translation step"
        type: boolean
        default: false
      commit_docs:
        description: "Commit refreshed docs + zh cache back to main"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build deps
        run: npm install --no-save marked@15.0.0

      - name: Fetch Hugging Face docs
        # Skip automatic re-fetch on push (code deploys). Fetch on schedule / manual only.
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.skip_fetch != true) }}
        env:
          FETCH_CONCURRENCY: "12"
          FETCH_TIMEOUT_MS: "30000"
        run: node scripts/fetch-docs.mjs

      - name: Translate docs to zh-CN (hash-cached, prioritized)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_translate != true }}
        env:
          TRANSLATE_CONCURRENCY: "3"
          TRANSLATE_CHUNK: "1200"
          # Progressive: each run fills more of the cache (hash-skip already done)
          TRANSLATE_LIMIT: "400"
          TRANSLATE_INCLUDE_MODEL_DOC: "0"
        run: node scripts/translate-docs.mjs
        continue-on-error: true

      - name: Scrub secrets before commit
        run: node scripts/scrub-secrets.mjs docs/pages docs/zh docs/llms

      - name: Commit zh cache (primary)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.commit_docs != false) }}
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find docs -name '_full.md' -delete || true
          # Prefer committing zh only — EN pages from fetch often trip push-protection
          # (example API keys in model docs). zh is scrubbed on write.
          git add docs/zh || true
          if git diff --staged --quiet; then
            echo "No zh changes to commit"
          else
            git commit -m "chore: refresh Hugging Face zh-CN cache [skip ci]" || true
            git push origin HEAD:main || echo "zh push failed (will still deploy workspace copy)"
          fi

      - name: Commit EN docs refresh (best-effort)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.commit_docs != false) }}
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find docs -name '_full.md' -delete || true
          # Drop known push-protection tripwires before staging EN pages
          rm -f docs/pages/transformers/model_doc/ministral3.md \
                docs/pages/transformers/model_doc/mistral3.md \
                docs/pages/transformers/model_doc/mistral.md || true
          node scripts/scrub-secrets.mjs docs/pages docs/llms || true
          git add docs/llms.txt docs/llms-urls.txt docs/list.json docs/llms docs/pages || true
          git reset -q -- 'docs/**/_full.md' 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No EN doc changes to commit"
          else
            git commit -m "chore: refresh Hugging Face EN docs [skip ci]" || true
            git push origin HEAD:main || echo "EN push blocked by secret scanning — Pages still deploys from this job workspace"
          fi


      - name: Body quality report
        env:
          QUALITY_PAGES: docs/pages
          QUALITY_STRICT: "0"
        run: node scripts/quality-report.mjs

      - name: Build static site (EN + zh-CN)
        env:
          PAGES_BASE: /huggingface-docs
        run: node scripts/build-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
